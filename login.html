<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confia — Login</title>
  <link rel="stylesheet" href="./assets/css/login.css">
</head>
<body id="body">
 

  <main>
    <div class="login-box">
      <h1></h1>
      <p class="sub"></p>

      <div class="campo">
        <label>E-mail</label>
        <input type="email" placeholder="seu@email.com" />
      </div>

      <div class="campo">
        <div class="campo-header">
          <label>Senha</label>
          <a href="#">Esqueceu?</a>
        </div>
        <input type="password" placeholder="••••••••" />
      </div>

      <button class="btn-entrar">ENTRAR</button>

      <div class="divisor">OU</div>

      <a href="#" class="criar-conta">Não tem conta? <span>Crie uma agora</span></a>

      <div class="trust-badge">
        <div class="dot"></div>
        Dados verificados e protegidos por criptografia
      </div>
    </div>
  </main>
</body>
</html>
